<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Trader — Dark Echo Macro Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f7f4; color: #1a1a18; padding: 1.5rem; }
h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
.refresh-btn { font-size: 12px; padding: 4px 12px; border-radius: 8px; background: transparent; border: 1px solid #ccc; color: #666; cursor: pointer; margin-left: 12px; }
.refresh-btn:hover { background: #eee; }
.section-label { font-size: 11px; font-weight: 500; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin: 1.5rem 0 10px; }
.summary { background: #fff; border: 1px solid #e5e3dc; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.summary-item { text-align: center; }
.summary-item .label { font-size: 11px; color: #888; margin-bottom: 4px; }
.summary-item .value { font-size: 20px; font-weight: 500; }
.overall-badge { font-size: 14px; font-weight: 500; padding: 6px 18px; border-radius: 8px; display: inline-block; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.card { background: #fff; border: 1px solid #e5e3dc; border-radius: 12px; padding: 1rem 1.25rem; }
.card-title { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.signal-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0ede6; }
.signal-row:last-child { border-bottom: none; }
.signal-name { font-size: 14px; }
.signal-detail { font-size: 12px; color: #888; margin-top: 2px; }
.badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 8px; white-space: nowrap; }
.green { background: #eaf3de; color: #3b6d11; }
.red { background: #fcebeb; color: #a32d2d; }
.amber { background: #faeeda; color: #854f0b; }
.gray { background: #f1efe8; color: #5f5e5a; }
.bar-wrap { height: 5px; border-radius: 3px; background: #f0ede6; margin-top: 6px; width: 120px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; }
.metric-card { background: #f1efe8; border-radius: 8px; padding: 1rem; }
.metric-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.metric-value { font-size: 20px; font-weight: 500; }
.metric-changes { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.loading { color: #888; font-size: 14px; }
.last-updated { font-size: 11px; color: #aaa; text-align: right; margin-top: 1rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #639922; vertical-align: middle; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }
.pulse { animation: pulse 2s infinite; }
.key-input { font-size: 12px; padding: 5px 10px; border-radius: 8px; border: 1px solid #ccc; background: transparent; color: inherit; width: 220px; }
table.pipe { width: 100%; border-collapse: collapse; font-size: 13px; }
table.pipe th { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; text-align: right; padding: 4px 8px; font-weight: 500; }
table.pipe th:first-child, table.pipe td:first-child { text-align: left; }
table.pipe td { text-align: right; padding: 7px 8px; border-top: 1px solid #f0ede6; }
@media (prefers-color-scheme: dark) { table.pipe td { border-color: #2e2e2a; } .key-input { border-color: #444; } }
@media (prefers-color-scheme: dark) {
  body { background: #1a1a18; color: #e8e6df; }
  .card, .summary { background: #242420; border-color: #3a3a36; }
  .signal-row { border-color: #2e2e2a; }
  .metric-card { background: #2e2e2a; }
  .bar-wrap { background: #2e2e2a; }
  .green { background: #173404; color: #c0dd97; }
  .red { background: #501313; color: #f7c1c1; }
  .amber { background: #412402; color: #fac775; }
  .gray { background: #2c2c2a; color: #b4b2a9; }
  .refresh-btn { border-color: #444; color: #aaa; }
  .refresh-btn:hover { background: #2e2e2a; }
}
</style>
</head>
<body>

<div style="display:flex;align-items:center;margin-bottom:4px">
  <h1>Night Trader &mdash; Dark Echo</h1>
  <button class="refresh-btn" onclick="loadAll()">&#8634; refresh</button>
</div>
<div class="subtitle">Faber 10-month MA &middot; FRED macro indicators &middot; crypto ripple monitor</div>

<div id="summary" class="summary"><div class="loading">Loading signals...</div></div>

<div class="section-label" id="pipeline-label" style="display:none"><span class="dot pulse"></span>Pipeline snapshot</div>
<div class="card" id="pipeline-section" style="display:none"></div>

<div class="section-label">Faber 10-month moving average signals</div>
<div class="card">
  <div id="faber-section"><div class="loading">Fetching ETF data...</div></div>
</div>

<div class="section-label">FRED macro indicators</div>
<div class="grid2">
  <div class="card" id="rates-card"><div class="loading">Loading...</div></div>
  <div class="card" id="risk-card"><div class="loading">Loading...</div></div>
</div>

<div class="section-label">Crypto ripple monitor</div>
<div class="grid3" id="crypto-section">
  <div class="metric-card"><div class="loading">Loading...</div></div>
</div>

<div class="last-updated" id="last-updated"></div>

<script>
// Preferred data source: data.json published by the daily pipeline (no keys,
// no CORS proxies — see scripts/daily_run.py --publish). Live FRED fetch is a
// fallback: the key lives in localStorage only, entered via the inline field
// below (prompt() is blocked in sandboxed iframes, e.g. Notion embeds).
var FRED_KEY = '';
try { FRED_KEY = localStorage.getItem('FRED_KEY') || ''; } catch (e) {}
var CORS = 'https://api.allorigins.win/raw?url=';

function saveFredKey() {
  var v = (document.getElementById('fred-key-input').value || '').trim();
  if (!v) return;
  FRED_KEY = v;
  try { localStorage.setItem('FRED_KEY', v); } catch (e) {}
  loadAll();
}

function fredFetch(id) {
  if (!FRED_KEY) return Promise.resolve(null);
  var url = 'https://api.stlouisfed.org/fred/series/observations?series_id=' + id + '&api_key=' + FRED_KEY + '&file_type=json&sort_order=desc&limit=3';
  return fetch(CORS + encodeURIComponent(url))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var obs = d.observations.filter(function(o) { return o.value !== '.' && o.value !== 'ND'; });
      return obs.length ? { current: parseFloat(obs[0].value), prev: obs.length > 1 ? parseFloat(obs[1].value) : null, date: obs[0].date } : null;
    })
    .catch(function() { return null; });
}

function etfFetch(ticker) {
  var url = 'https://query1.finance.yahoo.com/v8/finance/chart/' + ticker + '?interval=1mo&range=14mo';
  return fetch(CORS + encodeURIComponent(url))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      return d.chart.result[0].indicators.quote[0].close.filter(function(v) { return v != null; });
    })
    .catch(function() { return null; });
}

function faberSignal(prices) {
  if (!prices || prices.length < 10) return null;
  var last10 = prices.slice(-10);
  var ma10 = last10.reduce(function(a, b) { return a + b; }, 0) / 10;
  var current = prices[prices.length - 1];
  var pct = ((current / ma10 - 1) * 100).toFixed(1);
  var ratio = Math.min(Math.max(((current / ma10) - 0.9) / 0.2 * 100, 0), 100);
  return { current: current.toFixed(2), ma10: ma10.toFixed(2), above: current > ma10, pct: pct, ratio: ratio };
}

var ASSETS = [
  { ticker: 'GLD', name: 'Gold', desc: 'Inflation &middot; geopolitical hedge' },
  { ticker: 'TLT', name: 'Long bonds', desc: 'Rate expectations signal' },
  { ticker: 'XLE', name: 'Energy', desc: 'Oil / supply cycle proxy' },
  { ticker: 'EEM', name: 'Emerging markets', desc: 'Dollar strength &middot; risk appetite' },
  { ticker: 'ITA', name: 'Defense', desc: 'Geopolitical escalation proxy' }
];

function loadFaber() {
  return Promise.all(ASSETS.map(function(a) {
    return etfFetch(a.ticker).then(function(prices) {
      return Object.assign({}, a, { sig: faberSignal(prices) });
    });
  })).then(function(results) {
    document.getElementById('faber-section').innerHTML = results.map(function(a) {
      if (!a.sig) return '<div class="signal-row"><div><div class="signal-name">' + a.name + ' <span style="font-size:12px;color:#aaa">' + a.ticker + '</span></div><div class="signal-detail">' + a.desc + '</div></div><span class="badge gray">unavailable</span></div>';
      var cls = a.sig.above ? 'green' : 'red';
      var label = a.sig.above ? ('HOLD +' + a.sig.pct + '%') : ('&rarr; CASH ' + a.sig.pct + '%');
      var fillColor = a.sig.above ? '#639922' : '#e24b4a';
      return '<div class="signal-row"><div><div class="signal-name">' + a.name + ' <span style="font-size:12px;color:#aaa">' + a.ticker + '</span></div><div class="signal-detail">' + a.desc + '</div><div class="bar-wrap"><div class="bar-fill" style="width:' + a.sig.ratio + '%;background:' + fillColor + '"></div></div></div><div style="text-align:right;margin-left:1rem"><span class="badge ' + cls + '">' + label + '</span><div style="font-size:11px;color:#aaa;margin-top:4px">$' + a.sig.current + ' vs MA $' + a.sig.ma10 + '</div></div></div>';
    }).join('');
    return results;
  });
}

function fmt(v, d, suffix) {
  return (v === null || v === undefined) ? 'n/a' : v.toFixed(d) + (suffix || '');
}

function loadPipeline() {
  return fetch('data.json?_=' + Date.now())
    .then(function(r) { return r.ok ? r.json() : null; })
    .catch(function() { return null; })
    .then(function(d) {
      if (!d || !d.features || !d.features.length) return null;
      var rows = d.features.map(function(f) {
        var r5 = f.ret_5d_pct, cls = r5 === null ? 'gray' : r5 > 0.5 ? 'green' : r5 < -0.5 ? 'red' : 'gray';
        return '<tr><td><b>' + f.ticker + '</b></td><td>$' + fmt(f.close, 2) +
          '</td><td><span class="badge ' + cls + '">' + (r5 > 0 ? '+' : '') + fmt(r5, 1, '%') + '</span></td>' +
          '<td>' + fmt(f.ret_21d_pct, 1, '%') + '</td><td>' + fmt(f.dist_ma50_pct, 1, '%') + '</td>' +
          '<td>' + fmt(f.dist_ma200_pct, 1, '%') + '</td><td>' + fmt(f.realized_vol_20d_pct, 0, '%') + '</td></tr>';
      }).join('');
      var asOf = d.features[0].as_of || (d.generated_at || '').slice(0, 10);
      document.getElementById('pipeline-section').innerHTML =
        '<div class="card-title">Bucket-1 features <span style="font-size:11px;color:#aaa;font-weight:400">as of ' + asOf +
        ' &middot; computed by daily_run.py</span></div>' +
        '<div style="overflow-x:auto"><table class="pipe"><tr><th>ticker</th><th>close</th><th>5d</th><th>21d</th><th>vs MA50</th><th>vs MA200</th><th>vol 20d</th></tr>' +
        rows + '</table></div>';
      document.getElementById('pipeline-label').style.display = '';
      document.getElementById('pipeline-section').style.display = '';
      return d;
    });
}

function renderFredCards(v, sourceNote) {
  var spread = (v.t10 !== null && v.t10 !== undefined && v.t2 !== null && v.t2 !== undefined) ? (v.t10 - v.t2) : null;
  var sCls = spread === null ? 'gray' : spread < 0 ? 'red' : spread < 0.5 ? 'amber' : 'green';
  var sLbl = spread === null ? 'n/a' : spread < 0 ? 'inverted &#9888;' : spread < 0.5 ? 'flat &mdash; watch' : 'normal';
  document.getElementById('rates-card').innerHTML = '<div class="card-title">Interest rates <span style="font-size:11px;color:#aaa;font-weight:400">' + sourceNote + '</span></div><div class="signal-row"><div><div class="signal-name">Yield curve (2s10s)</div><div class="signal-detail">Primary recession predictor</div></div><div style="text-align:right"><span class="badge ' + sCls + '">' + sLbl + '</span><div style="font-size:11px;color:#aaa;margin-top:4px">' + (spread !== null ? spread.toFixed(2) + '%' : '') + '</div></div></div><div class="signal-row"><div><div class="signal-name">10Y Treasury yield</div><div class="signal-detail">Long-rate benchmark</div></div><div style="font-size:18px;font-weight:500">' + fmt(v.t10, 2, '%') + '</div></div><div class="signal-row"><div><div class="signal-name">2Y Treasury yield</div><div class="signal-detail">Fed expectations proxy</div></div><div style="font-size:18px;font-weight:500">' + fmt(v.t2, 2, '%') + '</div></div><div class="signal-row"><div><div class="signal-name">Fed funds rate</div><div class="signal-detail">Current policy rate</div></div><div style="font-size:18px;font-weight:500">' + fmt(v.fed, 2, '%') + '</div></div>';
  var vixCls = v.vix === null ? 'gray' : v.vix > 30 ? 'red' : v.vix > 20 ? 'amber' : 'green';
  var vixLbl = v.vix === null ? 'n/a' : v.vix > 30 ? 'high fear &#9888;' : v.vix > 20 ? 'elevated' : 'calm';
  var hyCls = v.hy === null ? 'gray' : v.hy > 5 ? 'red' : v.hy > 3.5 ? 'amber' : 'green';
  var hyLbl = v.hy === null ? 'n/a' : v.hy > 5 ? 'wide &mdash; risk off' : v.hy > 3.5 ? 'widening' : 'tight &mdash; risk on';
  document.getElementById('risk-card').innerHTML = '<div class="card-title">Risk indicators <span style="font-size:11px;color:#aaa;font-weight:400">' + sourceNote + '</span></div><div class="signal-row"><div><div class="signal-name">VIX volatility index</div><div class="signal-detail">Market fear gauge</div></div><div style="text-align:right"><span class="badge ' + vixCls + '">' + vixLbl + '</span><div style="font-size:11px;color:#aaa;margin-top:4px">' + (v.vix !== null ? v.vix.toFixed(1) : '') + '</div></div></div><div class="signal-row"><div><div class="signal-name">HY credit spread</div><div class="signal-detail">Stress in credit markets</div></div><div style="text-align:right"><span class="badge ' + hyCls + '">' + hyLbl + '</span><div style="font-size:11px;color:#aaa;margin-top:4px">' + (v.hy !== null ? v.hy.toFixed(2) + '%' : '') + '</div></div></div><div class="signal-row"><div style="font-size:13px;color:#888">Ripple rule: VIX &gt;30 = reduce risk. HY spread &gt;5% = move defensive.</div></div>';
  return { spread: spread, vix: v.vix, hy: v.hy };
}

function loadFRED(pipe) {
  if (FRED_KEY) {
    return Promise.all([fredFetch('DGS10'), fredFetch('DGS2'), fredFetch('FEDFUNDS'), fredFetch('VIXCLS'), fredFetch('BAMLH0A0HYM2')])
      .then(function(r) {
        return renderFredCards({
          t10: r[0] ? r[0].current : null, t2: r[1] ? r[1].current : null,
          fed: r[2] ? r[2].current : null, vix: r[3] ? r[3].current : null,
          hy: r[4] ? r[4].current : null
        }, 'live FRED');
      });
  }
  if (pipe && pipe.macro) {
    var m = pipe.macro;
    return Promise.resolve(renderFredCards(
      { t10: m.DGS10, t2: m.DGS2, fed: m.FEDFUNDS, vix: m.VIXCLS, hy: m.BAMLH0A0HYM2 },
      'pipeline &middot; ' + (m.as_of || '').slice(0, 10)
    ));
  }
  document.getElementById('rates-card').innerHTML = '<div class="card-title">Interest rates</div><div style="font-size:13px;color:#888;margin-bottom:10px">No pipeline data.json found. Enter a free FRED API key for live data (stored only in this browser):</div><input id="fred-key-input" class="key-input" type="password" placeholder="FRED API key"> <button class="refresh-btn" onclick="saveFredKey()">save</button>';
  document.getElementById('risk-card').innerHTML = '<div class="card-title">Risk indicators</div><div style="font-size:13px;color:#888">Waiting for a FRED key or published pipeline data&hellip;</div>';
  return Promise.resolve({ spread: null, vix: null, hy: null });
}

function loadCrypto() {
  return fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true&include_7d_change=true')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var coins = [{ id: 'bitcoin', name: 'Bitcoin', short: 'BTC' }, { id: 'ethereum', name: 'Ethereum', short: 'ETH' }];
      document.getElementById('crypto-section').innerHTML = coins.map(function(c) {
        var data = d[c.id];
        if (!data) return '';
        var c24 = data.usd_24h_change ? data.usd_24h_change.toFixed(1) : '0';
        var c7 = data.usd_7d_change ? data.usd_7d_change.toFixed(1) : '0';
        var cls24 = c24 < -8 ? 'red' : c24 < -3 ? 'amber' : c24 > 5 ? 'green' : 'gray';
        return '<div class="metric-card"><div class="metric-label">' + c.name + ' (' + c.short + ')</div><div class="metric-value">$' + data.usd.toLocaleString() + '</div><div class="metric-changes"><span class="badge ' + cls24 + '">' + (c24 > 0 ? '+' : '') + c24 + '% 24h</span><span class="badge gray">' + (c7 > 0 ? '+' : '') + c7 + '% 7d</span></div></div>';
      }).join('');
    })
    .catch(function() {
      document.getElementById('crypto-section').innerHTML = '<div style="font-size:12px;color:#aaa">CoinGecko rate limited &mdash; retry in 60s</div>';
    });
}

function buildSummary(faberResults, fredData) {
  var valid = faberResults.filter(function(a) { return a.sig; });
  var holds = valid.filter(function(a) { return a.sig.above; }).length;
  var total = valid.length;
  var riskLvl = fredData.vix === null ? 'n/a' : fredData.vix > 30 ? 'high' : fredData.vix > 20 ? 'elevated' : 'low';
  var curveStatus = fredData.spread === null ? 'n/a' : fredData.spread < 0 ? 'inverted' : fredData.spread < 0.5 ? 'flat' : 'normal';
  var overall = total === 0 ? 'NO DATA' : holds >= 4 ? 'RISK-ON' : holds <= 1 ? 'RISK-OFF' : 'MIXED';
  var oCls = total === 0 ? 'gray' : holds >= 4 ? 'green' : holds <= 1 ? 'red' : 'amber';
  document.getElementById('summary').innerHTML = '<div class="summary-item"><div class="label">Overall signal</div><span class="overall-badge ' + oCls + '">' + overall + '</span></div><div class="summary-item"><div class="label">Assets above 10M MA</div><div class="value">' + holds + ' / ' + total + '</div></div><div class="summary-item"><div class="label">Yield curve</div><div class="value" style="font-size:16px">' + curveStatus + '</div></div><div class="summary-item"><div class="label">Market fear (VIX)</div><div class="value" style="font-size:16px">' + riskLvl + '</div></div><div class="summary-item"><div class="label">Monthly check</div><div class="value" style="font-size:13px;color:#888">last trading day</div></div>';
}

function loadAll() {
  document.getElementById('summary').innerHTML = '<div class="loading">Refreshing...</div>';
  loadPipeline().then(function(pipe) {
    return Promise.all([loadFaber(), loadFRED(pipe), loadCrypto()]);
  }).then(function(results) {
    var faberResults = results[0];
    var fredData = results[1];
    if (faberResults && fredData) buildSummary(faberResults, fredData);
    document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleString();
  });
}

loadAll();
setInterval(loadAll, 15 * 60 * 1000);  // auto-refresh while the page (or embed) stays open
</script>
</body>
</html>
