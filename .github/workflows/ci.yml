name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Tests (offline — no network, no secrets)
        run: uv run pytest
